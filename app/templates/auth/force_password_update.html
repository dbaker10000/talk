{% extends "base.html" %}
{% block title %}Update Password | {{ app_name }}{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Set a new password</h1>
  <p class="lede">Your account is using a temporary password. Choose a permanent one to continue.</p>
  <form method="post" class="stack-form">
    <label>
      <span>New password</span>
      <input type="password" name="password" minlength="10" required>
    </label>
    <label>
      <span>Confirm new password</span>
      <input type="password" name="confirm_password" minlength="10" required>
    </label>
    <button class="button button-primary" type="submit">Update password</button>
  </form>
</section>
{% endblock %}
